<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>02 — Kana Camera Overlay | esaKITs</title><style>body{font:16px system-ui,-apple-system,sans-serif;margin:0;background:#101820;color:#fff}header{padding:14px 16px}h1{font-size:20px;margin:0 0 6px}.note{font-size:13px;color:#d2dae4;margin:0}.stage{position:relative;width:100%;background:#000;overflow:hidden}video{display:block;width:100%;height:auto;max-height:67vh;object-fit:contain}canvas.overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}section{padding:14px 16px}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:9px;padding:12px 16px;font-size:16px;font-weight:650;background:#64c4f5;color:#06273d}button:disabled{opacity:.45}#status{padding:10px 0;min-height:28px}#recognized{white-space:pre-wrap;overflow-wrap:anywhere;background:#22313c;padding:12px;border-radius:8px;min-height:36px}details{font-size:13px;color:#d3dfeb}a{color:#8ddaff}</style><header><h1>02 — Kana Camera Overlay</h1><p class="note">無料・広告なし・登録不要。かなとルビだけをローマ字に置き換える試作版です。</p></header><div class="stage" id="stage"><video id="video" autoplay muted playsinline></video><canvas class="overlay" id="overlay"></canvas></div><section><div class="actions"><button id="start">カメラを開始</button><button id="stop" disabled>停止</button><button id="scan" disabled>今の映像を認識</button></div><div id="status" role="status">カメラを開始してください。</div><details><summary>認識したかなを確認</summary><div id="recognized"></div></details><p class="note">02版：連続するかなの結合、周辺背景色、位置の平滑化を試験中です。カメラはリアルタイム表示ですが、文字認識は約3秒間隔で更新します。背景が複雑な場合や小さなルビは、正確に置換できない場合があります。映像は外部に送信せず、端末内でOCRを行います。OCR用データは初回にダウンロードします。</p></section><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>
const $=id=>document.getElementById(id),video=$('video'),overlay=$('overlay'),ctx=overlay.getContext('2d'),stage=$('stage');let stream=null,worker=null,active=false,busy=false,runId=0;const work=document.createElement('canvas');const wc=work.getContext('2d',{willReadFrequently:true});const map={あ:'a',い:'i',う:'u',え:'e',お:'o',か:'ka',き:'ki',く:'ku',け:'ke',こ:'ko',さ:'sa',し:'shi',す:'su',せ:'se',そ:'so',た:'ta',ち:'chi',つ:'tsu',て:'te',と:'to',な:'na',に:'ni',ぬ:'nu',ね:'ne',の:'no',は:'ha',ひ:'hi',ふ:'fu',へ:'he',ほ:'ho',ま:'ma',み:'mi',む:'mu',め:'me',も:'mo',や:'ya',ゆ:'yu',よ:'yo',ら:'ra',り:'ri',る:'ru',れ:'re',ろ:'ro',わ:'wa',を:'o',ん:'n',が:'ga',ぎ:'gi',ぐ:'gu',げ:'ge',ご:'go',ざ:'za',じ:'ji',ず:'zu',ぜ:'ze',ぞ:'zo',だ:'da',ぢ:'ji',づ:'zu',で:'de',ど:'do',ば:'ba',び:'bi',ぶ:'be',べ:'be',ぼ:'bo',ぱ:'pa',ぴ:'pi',ぷ:'pu',ぺ:'pe',ぽ:'po'};map['ぶ']='bu';const pairs={きゃ:'kya',きゅ:'kyu',きょ:'kyo',しゃ:'sha',しゅ:'shu',しょ:'sho',ちゃ:'cha',ちゅ:'chu',ちょ:'cho',にゃ:'nya',にゅ:'nyu',にょ:'nyo',ひゃ:'hya',ひゅ:'hyu',ひょ:'hyo',みゃ:'mya',みゅ:'myu',みょ:'myo',りゃ:'rya',りゅ:'ryu',りょ:'ryo',ぎゃ:'gya',ぎゅ:'gyu',ぎょ:'gyo',じゃ:'ja',じゅ:'ju',じょ:'jo',びゃ:'bya',びゅ:'byu',びょ:'byo',ぴゃ:'pya',ぴゅ:'pyu',ぴょ:'pyo'};
function romaji(t){t=t.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));let out='';for(let i=0;i<t.length;i++){let c=t[i],pair=t.slice(i,i+2);if(c==='っ'){let n=pairs[t.slice(i+1,i+3)]||map[t[i+1]]||'';out+=n.startsWith('ch')?'t':n[0]||'';continue}if(c==='ー'){let m=out.match(/[aeiou]$/);if(m)out+=m[0];continue}if(pairs[pair]){out+=pairs[pair];i++;continue}out+=map[c]??c}return out.replace(/ou/g,'ō').replace(/oo/g,'ō').replace(/aa/g,'ā').replace(/uu/g,'ū').replace(/ee/g,'ē').replace(/ii/g,'ī')}
const kanaOnly=/^[ぁ-ゖァ-ヺー・\\s]+$/;
let previousItems=[];
function extract(data){const words=data.words||data.blocks?.flatMap(b=>(b.paragraphs||[]).flatMap(p=>(p.lines||[]).flatMap(l=>l.words||[])))||[];const parts=[];for(const w of words){const t=(w.text||'').trim();if(!w.bbox||!t)continue;const b=w.bbox;const h=b.y1-b.y0;if(h<=0)continue;
// Mixed kanji-kana OCR words are not painted: never erase kanji.
if(kanaOnly.test(t)&&/[ぁ-ゖァ-ヺ]/.test(t))parts.push({text:t,box:{...b}})}
parts.sort((a,b)=>{const ha=a.box.y1-a.box.y0,hb=b.box.y1-b.box.y0;return Math.abs((a.box.y0+a.box.y1)/2-(b.box.y0+b.box.y1)/2)<Math.min(ha,hb)*.48?a.box.x0-b.box.x0:a.box.y0-b.box.y0});
const joined=[];for(const p of parts){const prev=joined[joined.length-1];if(prev){const a=prev.box,b=p.box,h1=a.y1-a.y0,h2=b.y1-b.y0,gap=b.x0-a.x1,dy=Math.abs((a.y0+a.y1)/2-(b.y0+b.y1)/2);if(gap>=-Math.min(h1,h2)*.12&&gap<Math.min(h1,h2)*.65&&dy<Math.min(h1,h2)*.40&&Math.max(h1,h2)/Math.min(h1,h2)<1.8){prev.text+=p.text;prev.box={x0:Math.min(a.x0,b.x0),y0:Math.min(a.y0,b.y0),x1:Math.max(a.x1,b.x1),y1:Math.max(a.y1,b.y1)};continue}}joined.push(p)}
return joined}
function backgroundAt(x,y,w,h){const pts=[[x-3,y+h/2],[x+w+3,y+h/2],[x+w/2,y-3],[x+w/2,y+h+3]];const colors=[];for(const [px,py] of pts){if(px<0||py<0||px>=work.width||py>=work.height)continue;const d=wc.getImageData(Math.round(px),Math.round(py),1,1).data;colors.push([d[0],d[1],d[2]])}if(!colors.length)return [240,240,240];return [0,1,2].map(i=>Math.round(colors.reduce((s,c)=>s+c[i],0)/colors.length))}
function paint(items){overlay.width=work.width;overlay.height=work.height;ctx.clearRect(0,0,overlay.width,overlay.height);ctx.textBaseline='middle';for(const item of items){const b=item.box,x=b.x0,y=b.y0,w=b.x1-x,h=b.y1-y;if(w<2||h<2)continue;const out=romaji(item.text);const rgb=backgroundAt(x,y,w,h);const lum=.2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2];ctx.fillStyle='rgb('+rgb.join(',')+')';ctx.fillRect(x-1,y-1,w+2,h+2);ctx.fillStyle=lum>130?'#111':'#fff';let size=Math.max(8,Math.min(38,h*.83));ctx.font='600 '+size+'px system-ui';while(ctx.measureText(out).width>w+8&&size>8){size--;ctx.font='600 '+size+'px system-ui'}ctx.fillText(out,x,y+h/2)}}
function stabilize(items){const result=items.map(item=>{let best=null,dist=Infinity;for(const old of previousItems){if(old.text!==item.text)continue;const a=old.box,b=item.box;const d=Math.abs(a.x0-b.x0)+Math.abs(a.y0-b.y0);if(d<dist&&d<Math.max(25,(b.y1-b.y0)*1.4)){best=old;dist=d}}if(!best)return item;const b=item.box,a=best.box;return {text:item.text,box:{x0:.7*b.x0+.3*a.x0,y0:.7*b.y0+.3*a.y0,x1:.7*b.x1+.3*a.x1,y1:.7*b.y1+.3*a.y1}}});previousItems=result;return result}
async function scan(){if(!active||busy||!video.videoWidth)return;busy=true;const myId=runId;try{$('status').textContent=worker?'認識中…':'日本語OCRを準備中…';if(!worker){if(!window.Tesseract)throw Error('OCRライブラリが読み込まれていません');worker=await Tesseract.createWorker('jpn',1);await worker.setParameters({tessedit_pageseg_mode:'11'})}if(!active||myId!==runId)return;const scale=Math.min(1,960/Math.max(video.videoWidth,video.videoHeight));work.width=Math.round(video.videoWidth*scale);work.height=Math.round(video.videoHeight*scale);wc.drawImage(video,0,0,work.width,work.height);const result=await worker.recognize(work,{}, {text:true,blocks:true});if(!active||myId!==runId)return;const items=stabilize(extract(result.data));paint(items);$('recognized').textContent=items.map(x=>x.text+' → '+romaji(x.text)).join('\n')||'かな領域を検出できませんでした';$('status').textContent='認識完了：'+items.length+'箇所（約3秒後に再認識）'}catch(e){$('status').textContent='認識エラー：'+e.message}finally{busy=false;if(active&&myId===runId)setTimeout(scan,3000)}}
$('start').onclick=async()=>{if(active)return;try{if(!navigator.mediaDevices?.getUserMedia)throw Error('SafariでHTTPS接続が必要です');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});video.srcObject=stream;await video.play();active=true;runId++;$('start').disabled=true;$('stop').disabled=false;$('scan').disabled=false;scan()}catch(e){$('status').textContent='カメラを開始できません：'+e.message}};
$('stop').onclick=()=>{active=false;runId++;previousItems=[];stream?.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;ctx.clearRect(0,0,overlay.width,overlay.height);$('start').disabled=false;$('stop').disabled=true;$('scan').disabled=true;$('status').textContent='停止しました'};$('scan').onclick=()=>{if(!busy)scan()};
</script></html>

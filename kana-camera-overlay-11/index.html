const $=id=>document.getElementById(id),video=$('video'),overlay=$('overlay'),ctx=overlay.getContext('2d'),stage=$('stage');let stream=null,worker=null,active=false,busy=false,runId=0;const work=document.createElement('canvas');const wc=work.getContext('2d',{willReadFrequently:true});const map={あ:'a',い:'i',う:'u',え:'e',お:'o',か:'ka',き:'ki',く:'ku',け:'ke',こ:'ko',さ:'sa',し:'shi',す:'su',せ:'se',そ:'so',た:'ta',ち:'chi',つ:'tsu',て:'te',と:'to',な:'na',に:'ni',ぬ:'nu',ね:'ne',の:'no',は:'ha',ひ:'hi',ふ:'fu',へ:'he',ほ:'ho',ま:'ma',み:'mi',む:'mu',め:'me',も:'mo',や:'ya',ゆ:'yu',よ:'yo',ら:'ra',り:'ri',る:'ru',れ:'re',ろ:'ro',わ:'wa',を:'o',ん:'n',が:'ga',ぎ:'gi',ぐ:'gu',げ:'ge',ご:'go',ざ:'za',じ:'ji',ず:'zu',ぜ:'ze',ぞ:'zo',だ:'da',ぢ:'ji',づ:'zu',で:'de',ど:'do',ば:'ba',び:'bi',ぶ:'be',べ:'be',ぼ:'bo',ぱ:'pa',ぴ:'pi',ぷ:'pu',ぺ:'pe',ぽ:'po'};map['ぶ']='bu';const pairs={きゃ:'kya',きゅ:'kyu',きょ:'kyo',しゃ:'sha',しゅ:'shu',しょ:'sho',ちゃ:'cha',ちゅ:'chu',ちょ:'cho',にゃ:'nya',にゅ:'nyu',にょ:'nyo',ひゃ:'hya',ひゅ:'hyu',ひょ:'hyo',みゃ:'mya',みゅ:'myu',みょ:'myo',りゃ:'rya',りゅ:'ryu',りょ:'ryo',ぎゃ:'gya',ぎゅ:'gyu',ぎょ:'gyo',じゃ:'ja',じゅ:'ju',じょ:'jo',びゃ:'bya',びゅ:'byu',びょ:'byo',ぴゃ:'pya',ぴゅ:'pyu',ぴょ:'pyo'};
function romaji(t){t=t.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));let out='';for(let i=0;i<t.length;i++){let c=t[i],pair=t.slice(i,i+2);if(c==='っ'){let n=pairs[t.slice(i+1,i+3)]||map[t[i+1]]||'';out+=n.startsWith('ch')?'t':n[0]||'';continue}if(c==='ー'){let m=out.match(/[aeiou]$/);if(m)out+=m[0];continue}if(pairs[pair]){out+=pairs[pair];i++;continue}out+=map[c]??c}return out.replace(/ou/g,'ō').replace(/oo/g,'ō').replace(/aa/g,'ā').replace(/uu/g,'ū').replace(/ee/g,'ē').replace(/ii/g,'ī')}
const kanaOnly=/^[ぁ-ゖァ-ヺー・\s]+$/;
let previousItems=[];
const samples=['こちらをご確認ください','ご利用ありがとうございます','お子様が含まれています','管理してください','忘れないようにしてください','気をつけてください','日本語を勉強しています','よろしくおねがいします','お待ちしております','これから始めます','ご協力をお願いします','こちらで確認できます','もう一度お試しください','ここには何がありますか','ご覧いただきありがとうございます'];const ngrams=new Map();for(const sentence of samples){for(let n=2;n<=3;n++)for(let i=0;i<=sentence.length-n;i++){const k=sentence.slice(i,i+n);ngrams.set(k,(ngrams.get(k)||0)+1)}}function languageScore(t){let score=0;for(let n=2;n<=3;n++)for(let i=0;i<=t.length-n;i++)score+=Math.log1p(ngrams.get(t.slice(i,i+n))||0);return score}
function extract(data){const lines=(data.blocks||[]).flatMap(b=>(b.paragraphs||[]).flatMap(p=>p.lines||[]));const out=[];const kana=/[ぁ-ゖァ-ヺー]/;const chars=/[ぁ-ゖァ-ヺー]+/g;for(const line of lines){const ws=(line.words||[]).filter(w=>w.bbox&&w.text).sort((a,b)=>a.bbox.x0-b.bbox.x0);for(const w of ws){const t=w.text||'',b=w.bbox;if(!kana.test(t))continue;const symbols=(w.symbols||[]).filter(z=>z.bbox&&z.text);if(symbols.length){let run=null;const flush=()=>{if(run){out.push(run);run=null}};for(const z of symbols){if(kana.test(z.text)){if(!run)run={text:z.text,box:{...z.bbox},angle:0};else{run.text+=z.text;run.box.x0=Math.min(run.box.x0,z.bbox.x0);run.box.y0=Math.min(run.box.y0,z.bbox.y0);run.box.x1=Math.max(run.box.x1,z.bbox.x1);run.box.y1=Math.max(run.box.y1,z.bbox.y1)}}else flush()}flush();continue}
for(const m of t.matchAll(chars)){const n=[...t].length,st=[...t.slice(0,m.index)].length,len=[...m[0]].length;if(!n||!len)continue;const x0=b.x0+(b.x1-b.x0)*st/n,x1=b.x0+(b.x1-b.x0)*(st+len)/n;out.push({text:m[0],box:{x0,y0:b.y0,x1,y1:b.y1},angle:0})}}}
return out.filter(p=>p.box.x0>=0&&p.box.y0>=0&&p.box.x1<=work.width&&p.box.y1<=work.height&&p.box.x1-p.box.x0>=3)}
function backgroundAt(x,y,w,h){const pts=[[x-3,y+h/2],[x+w+3,y+h/2],[x+w/2,y-3],[x+w/2,y+h+3]];const colors=[];for(const [px,py] of pts){if(px<0||py<0||px>=work.width||py>=work.height)continue;const d=wc.getImageData(Math.round(px),Math.round(py),1,1).data;colors.push([d[0],d[1],d[2]])}if(!colors.length)return [240,240,240];return [0,1,2].map(i=>Math.round(colors.reduce((s,c)=>s+c[i],0)/colors.length))}
function paint(items){overlay.width=work.width;overlay.height=work.height;ctx.clearRect(0,0,overlay.width,overlay.height);ctx.textBaseline='middle';for(const item of items){const b=item.box,x=b.x0,y=b.y0,w=b.x1-x,h=b.y1-y;if(w<3||h<4)continue;const out=romaji(item.text);if(!out||/[^a-zāīūēō\-]/i.test(out))continue;ctx.save();ctx.translate(x+w/2,y+h/2);let size=Math.min(44,h*.72);ctx.font='700 '+size+'px system-ui';while(ctx.measureText(out).width>w-2&&size>7){size-=.5;ctx.font='700 '+size+'px system-ui'}const tw=ctx.measureText(out).width;const actualW=tw+Math.max(2,size*.18);const bandH=Math.min(h,size*1.18);ctx.fillStyle='rgba(238,238,238,.88)';ctx.fillRect(-actualW/2,-bandH/2,actualW,bandH);ctx.fillStyle='#101820';ctx.fillText(out,-tw/2,0);ctx.restore()}}
function alignOverlay(){if(!video.videoWidth)return;const r=video.getBoundingClientRect(),scale=Math.min(r.width/video.videoWidth,r.height/video.videoHeight),w=video.videoWidth*scale,h=video.videoHeight*scale;overlay.style.left=(r.width-w)/2+'px';overlay.style.top=(r.height-h)/2+'px';overlay.style.width=w+'px';overlay.style.height=h+'px'}
let tracks=[],lastFrame=null,frameChanged=false;
function imageSignature(){const c=document.createElement('canvas');c.width=16;c.height=12;const q=c.getContext('2d',{willReadFrequently:true});q.drawImage(work,0,0,16,12);const d=q.getImageData(0,0,16,12).data;const out=[];for(let i=0;i<d.length;i+=4)out.push((d[i]*.299+d[i+1]*.587+d[i+2]*.114));return out}
function motionLevel(next){if(!lastFrame)return 0;let diff=0;for(let i=0;i<next.length;i++)diff+=Math.abs(next[i]-lastFrame[i]);return diff/next.length}
function updateTracks(items,largeMotion){const now=performance.now();if(largeMotion)tracks=[];const matched=new Set();for(const it of items){const b=it.box,cy=(b.y0+b.y1)/2,cx=(b.x0+b.x1)/2,h=b.y1-b.y0;let best=-1,bestD=Infinity;for(let i=0;i<tracks.length;i++){if(matched.has(i)||tracks[i].text!==it.text)continue;const p=tracks[i].box,d=Math.hypot(cx-(p.x0+p.x1)/2,cy-(p.y0+p.y1)/2);if(d<Math.max(18,h*1.7)&&d<bestD){best=i;bestD=d}}if(best>=0){const t=tracks[best],p=t.box,alpha=.32;t.box={x0:p.x0*(1-alpha)+b.x0*alpha,y0:p.y0*(1-alpha)+b.y0*alpha,x1:p.x1*(1-alpha)+b.x1*alpha,y1:p.y1*(1-alpha)+b.y1*alpha};t.lastSeen=now;t.misses=0;matched.add(best)}else{tracks.push({...it,box:{...b},lastSeen:now,misses:0});matched.add(tracks.length-1)}}tracks=tracks.filter((t,i)=>{if(!matched.has(i))t.misses++;return t.misses<=2&&now-t.lastSeen<4500});return tracks}
// Lightweight on-device block matching. Coordinates are in OCR canvas pixels.
let trackingTimer=null,trackPrev=null,trackTotalX=0,trackTotalY=0,trackGeneration=0;
const trackCanvas=document.createElement('canvas');trackCanvas.width=160;trackCanvas.height=120;const trackCtx=trackCanvas.getContext('2d',{willReadFrequently:true});
function trackingFrame(){if(!active||!video.videoWidth)return null;trackCtx.drawImage(video,0,0,160,120);const rgba=trackCtx.getImageData(0,0,160,120).data,gray=new Uint8Array(160*120);for(let i=0;i<gray.length;i++)gray[i]=(.299*rgba[i*4]+.587*rgba[i*4+1]+.114*rgba[i*4+2])|0;return gray}
function blockMotion(prev,cur){const anchors=[[40,30],[80,30],[120,30],[40,60],[80,60],[120,60],[40,90],[80,90],[120,90]],moves=[];for(const [x,y] of anchors){let mean=0,variance=0;for(let yy=-6;yy<=6;yy+=2)for(let xx=-6;xx<=6;xx+=2)mean+=prev[(y+yy)*160+x+xx];mean/=49;for(let yy=-6;yy<=6;yy+=2)for(let xx=-6;xx<=6;xx+=2){const v=prev[(y+yy)*160+x+xx]-mean;variance+=v*v}if(variance/49<130)continue;let best=Infinity,second=Infinity,bx=0,by=0;for(let dy=-9;dy<=9;dy++)for(let dx=-9;dx<=9;dx++){let error=0;for(let yy=-6;yy<=6;yy+=2)for(let xx=-6;xx<=6;xx+=2)error+=Math.abs(prev[(y+yy)*160+x+xx]-cur[(y+yy+dy)*160+x+xx+dx]);if(error<best){second=best;best=error;bx=dx;by=dy}else if(error<second)second=error}if(best/49<35)moves.push({x:bx,y:by})}if(moves.length<3)return null;const xs=moves.map(p=>p.x).sort((a,b)=>a-b),ys=moves.map(p=>p.y).sort((a,b)=>a-b),dx=xs[Math.floor(xs.length/2)],dy=ys[Math.floor(ys.length/2)],inliers=moves.filter(p=>Math.abs(p.x-dx)<=2&&Math.abs(p.y-dy)<=2);return inliers.length>=Math.max(3,Math.ceil(moves.length*.6))?{dx,dy}:null}
function trackTick(){if(!active)return;try{const now=trackingFrame();if(now&&trackPrev&&displayItemsPresent()){const move=blockMotion(trackPrev,now);if(move){const sx=work.width/160,sy=work.height/120,dx=move.dx*sx,dy=move.dy*sy;for(const t of tracks){t.box.x0+=dx;t.box.x1+=dx;t.box.y0+=dy;t.box.y1+=dy}trackTotalX+=dx;trackTotalY+=dy;paint(tracks)}else if(tracks.length){trackGeneration++;tracks=[];ctx.clearRect(0,0,overlay.width,overlay.height)}}trackPrev=now}catch(e){trackPrev=null}trackingTimer=setTimeout(trackTick,150)}
function displayItemsPresent(){return tracks.length>0}
function resetTracking(){if(trackingTimer!==null)clearTimeout(trackingTimer);trackingTimer=null;trackPrev=null;trackTotalX=0;trackTotalY=0;trackGeneration++}
const enhanced=document.createElement('canvas'),ec=enhanced.getContext('2d',{willReadFrequently:true});
function averageBrightness(){const w=work.width,h=work.height;const d=wc.getImageData(0,0,w,h).data;let sum=0,n=0;for(let y=0;y<h;y+=12)for(let x=0;x<w;x+=12){let k=(y*w+x)*4;sum+=.2126*d[k]+.7152*d[k+1]+.0722*d[k+2];n++}return sum/Math.max(n,1)}
function prepareEnhanced(invert){const factor=1.5;enhanced.width=Math.round(work.width*factor);enhanced.height=Math.round(work.height*factor);ec.imageSmoothingEnabled=true;ec.imageSmoothingQuality='high';ec.drawImage(work,0,0,enhanced.width,enhanced.height);if(invert){const img=ec.getImageData(0,0,enhanced.width,enhanced.height);for(let i=0;i<img.data.length;i+=4){img.data[i]=255-img.data[i];img.data[i+1]=255-img.data[i+1];img.data[i+2]=255-img.data[i+2]}ec.putImageData(img,0,0)}}
function normalizeItems(items,factor){return items.map(it=>({...it,box:{x0:it.box.x0/factor,y0:it.box.y0/factor,x1:it.box.x1/factor,y1:it.box.y1/factor}}))}
function scoreItems(items){return items.reduce((sum,it)=>{const n=[...it.text].length;return sum+Math.min(n,24)*(n>=3?1.25:1)*(it.box.x1-it.box.x0>=8?1:0.5)},0)}
async function scan(){if(!active||busy||!video.videoWidth)return;busy=true;const myId=runId;const started=performance.now();try{$('status').textContent=worker?'認識中…':'日本語OCRを準備中…';if(!worker){if(!window.Tesseract)throw Error('OCRライブラリが読み込まれていません');worker=await Tesseract.createWorker('jpn',1);await worker.setParameters({tessedit_pageseg_mode:'11'})}if(!active||myId!==runId)return;const scale=Math.min(1,1280/Math.max(video.videoWidth,video.videoHeight));work.width=Math.round(video.videoWidth*scale);work.height=Math.round(video.videoHeight*scale);wc.drawImage(video,0,0,work.width,work.height);const captureX=trackTotalX,captureY=trackTotalY,captureGeneration=trackGeneration;const frameSignature=imageSignature();const result=await worker.recognize(work,{}, {text:true,blocks:true});if(!active||myId!==runId)return;const items=extract(result.data);const motion=motionLevel(frameSignature),largeMotion=motion>23;if(captureGeneration!==trackGeneration){tracks=[]}else{const dx=trackTotalX-captureX,dy=trackTotalY-captureY;for(const item of items){item.box.x0+=dx;item.box.x1+=dx;item.box.y0+=dy;item.box.y1+=dy}}const stable=updateTracks(items,largeMotion);lastFrame=frameSignature;alignOverlay();paint(stable);$('recognized').textContent='OCR全文：\n'+(result.data.text||'（認識なし）')+'\n\nかな：\n'+(items.map(x=>x.text+' → '+romaji(x.text)).join('\n')||'（検出なし）');$('status').textContent='認識：'+items.length+'箇所 / '+((performance.now()-started)/1000).toFixed(1)+'秒';}catch(e){$('status').textContent='認識エラー：'+e.message}finally{busy=false;if(active&&myId===runId)setTimeout(scan,200)}}
$('start').onclick=async()=>{if(active)return;try{if(!navigator.mediaDevices?.getUserMedia)throw Error('SafariでHTTPS接続が必要です');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});video.srcObject=stream;await video.play();alignOverlay();active=true;runId++;resetTracking();trackTick();$('start').disabled=true;$('stop').disabled=false;$('scan').disabled=false;scan()}catch(e){$('status').textContent='カメラを開始できません：'+e.message}};

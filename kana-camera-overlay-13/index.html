function extract(data){

   const w=words[wi],t=w.text||'',b=w.bbox;
   if(!kana.test(t))continue;
   const symbols=(w.symbols||[]).filter(z=>z.bbox&&z.text);
   if(symbols.length){
    let run=null;
    const flush=()=>{if(run){parts.push(run);run=null}};
    for(const z of symbols){
     if(kana.test(z.text)){
      if(!run)run={text:z.text,box:{...z.bbox},word:wi};
      else{run.text+=z.text;run.box=union(run.box,z.bbox)}
     }else flush();
    }
    flush();
   }else{
    for(const m of t.matchAll(runs)){
     const n=[...t].length,st=[...t.slice(0,m.index)].length,len=[...m[0]].length;
     if(!n||!len)continue;
     parts.push({text:m[0],box:{x0:b.x0+(b.x1-b.x0)*st/n,y0:b.y0,x1:b.x0+(b.x1-b.x0)*(st+len)/n,y1:b.y1},word:wi})
    }
   }
  }
  parts.sort((a,b)=>a.box.x0-b.box.x0);
  const groups=[];
  for(const part of parts){
   const p=groups[groups.length-1];
   if(p){
    const a=p.box,b=part.box,ha=a.y1-a.y0,hb=b.y1-b.y0,ratio=Math.min(ha,hb)/Math.max(ha,hb),overY=Math.max(0,Math.min(a.y1,b.y1)-Math.max(a.y0,b.y0))/Math.min(ha,hb);
    const gap=b.x0-a.x1,unit=Math.min(ha,hb),intervening=words.some((w,i)=>i>p.lastWord&&i<part.word&&/[一-龯々〆ヵヶA-Za-z0-9]/.test(w.text||''));

  }

 }

function backgroundAt(x,y,w,h){const pts=[[x-3,y+h/2],[x+w+3,y+h/2],[x+w/2,y-3],[x+w/2,y+h+3]];const colors=[];for(const [px,py] of pts){if(px<0||py<0||px>=work.width||py>=work.height)continue;const d=wc.getImageData(Math.round(px),Math.round(py),1,1).data;colors.push([d[0],d[1],d[2]])}if(!colors.length)return [240,240,240];return [0,1,2].map(i=>Math.round(colors.reduce((s,c)=>s+c[i],0)/colors.length))}
function paint(items){overlay.width=work.width;overlay.height=work.height;ctx.clearRect(0,0,overlay.width,overlay.height);ctx.textBaseline='middle';for(const item of items){const b=item.box,x=b.x0,y=b.y0,w=b.x1-x,h=b.y1-y;if(w<3||h<4)continue;const out=romaji(item.text);if(!out||/[^a-zāīūēō\-]/i.test(out))continue;ctx.save();ctx.translate(x+w/2,y+h/2);let size=Math.min(44,h*.72);ctx.font='700 '+size+'px system-ui';while(ctx.measureText(out).width>w-2&&size>7){size-=.5;ctx.font='700 '+size+'px system-ui'}const tw=ctx.measureText(out).width;const actualW=tw+Math.max(2,size*.18);const bandH=Math.min(h,size*1.18);ctx.fillStyle='rgba(238,238,238,.88)';ctx.fillRect(-actualW/2,-bandH/2,actualW,bandH);ctx.fillStyle='#101820';ctx.fillText(out,-tw/2,0);ctx.restore()}}

function updateTracks(items){const now=performance.now(),used=new Set();for(const it of items){let best=-1,score=0;for(let i=0;i<tracks.length;i++){if(used.has(i))continue;const p=tracks[i].box,b=it.box,h=Math.max(8,b.y1-b.y0,p.y1-p.y0),d=Math.hypot((b.x0+b.x1-p.x0-p.x1)/2,(b.y0+b.y1-p.y0-p.y1)/2),ov=overlap(p,b);const v=ov>.25?ov+1:d<h*.7?1-d/(h*.7):0;if(v>score){score=v;best=i}}if(best>=0&&score>.2){const t=tracks[best];used.add(best);t.lastSeen=now;t.misses=0;if(t.text===it.text){t.votes++;if(t.votes>=2)t.locked=true}else if(!t.locked){t.text=it.text;t.votes=1}const alpha=t.locked?.12:.4;for(const k of ['x0','y0','x1','y1'])t.box[k]=t.box[k]*(1-alpha)+it.box[k]*alpha}else{tracks.push({...it,box:{...it.box},lastSeen:now,misses:0,votes:1,locked:false});used.add(tracks.length-1)}}tracks=tracks.filter((t,i)=>{if(!used.has(i))t.misses++;return now-t.lastSeen<(t.locked?3000:1200)&&t.misses<(t.locked?7:3)});return tracks}

const trackCanvas=document.createElement('canvas');trackCanvas.width=160;trackCanvas.height=120;const trackCtx=trackCanvas.getContext('2d',{willReadFrequently:true});
function trackingFrame(){if(!active||!video.videoWidth)return null;trackCtx.drawImage(video,0,0,160,120);const rgba=trackCtx.getImageData(0,0,160,120).data,gray=new Uint8Array(160*120);for(let i=0;i<gray.length;i++)gray[i]=(.299*rgba[i*4]+.587*rgba[i*4+1]+.114*rgba[i*4+2])|0;return gray}
function blockMotion(prev,cur){const pts=[];for(let y=20;y<=100;y+=20)for(let x=20;x<=140;x+=20){let mean=0,v=0;for(let yy=-4;yy<=4;yy+=2)for(let xx=-4;xx<=4;xx+=2)mean+=prev[(y+yy)*160+x+xx];mean/=25;for(let yy=-4;yy<=4;yy+=2)for(let xx=-4;xx<=4;xx+=2)v+=(prev[(y+yy)*160+x+xx]-mean)**2;if(v/25<110)continue;let best=Infinity,bx=0,by=0;for(let dy=-7;dy<=7;dy++)for(let dx=-7;dx<=7;dx++){let err=0;for(let yy=-4;yy<=4;yy+=2)for(let xx=-4;xx<=4;xx+=2)err+=Math.abs(prev[(y+yy)*160+x+xx]-cur[(y+yy+dy)*160+x+xx+dx]);if(err<best){best=err;bx=dx;by=dy}}if(best/25<33)pts.push({x,y,u:x+bx,v:y+by})}if(pts.length<4)return null;let best=null,count=0;for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const p=pts[i],q=pts[j],dx=q.x-p.x,dy=q.y-p.y,den=dx*dx+dy*dy;if(den<300)continue;const du=q.u-p.u,dv=q.v-p.v,A=(dx*du+dy*dv)/den,B=(dx*dv-dy*du)/den,tx=p.u-A*p.x+B*p.y,ty=p.v-B*p.x-A*p.y;if(Math.hypot(A,B)<.8||Math.hypot(A,B)>1.2)continue;const n=pts.filter(t=>Math.hypot(A*t.x-B*t.y+tx-t.u,B*t.x+A*t.y+ty-t.v)<2.5).length;if(n>count){count=n;best={A,B,tx,ty}}}return count>=Math.max(4,Math.ceil(pts.length*.55))?best:null}
function moveBox(b,m){const sx=work.width/160,sy=work.height/120,pts=[[b.x0,b.y0],[b.x1,b.y0],[b.x1,b.y1],[b.x0,b.y1]].map(([x,y])=>{const u=x/sx,v=y/sy;return [(m.A*u-m.B*v+m.tx)*sx,(m.B*u+m.A*v+m.ty)*sy]});return {x0:Math.min(...pts.map(p=>p[0])),y0:Math.min(...pts.map(p=>p[1])),x1:Math.max(...pts.map(p=>p[0])),y1:Math.max(...pts.map(p=>p[1]))}}

async function scan(){if(!active||busy||!video.videoWidth)return;busy=true;const myId=runId;const started=performance.now();try{$('status').textContent=worker?'認識中…':'日本語OCRを準備中…';if(!worker){if(!window.Tesseract)throw Error('OCRライブラリが読み込まれていません');worker=await Tesseract.createWorker('jpn',1);await worker.setParameters({tessedit_pageseg_mode:'11'})}if(!active||myId!==runId)return;const scale=Math.min(1,1280/Math.max(video.videoWidth,video.videoHeight));work.width=Math.round(video.videoWidth*scale);work.height=Math.round(video.videoHeight*scale);wc.drawImage(video,0,0,work.width,work.height);const captureRevision=trackingRevision;const frameSignature=imageSignature();const result=await worker.recognize(work,{}, {text:true,blocks:true});if(!active||myId!==runId)return;const items=extract(result.data);const motion=motionLevel(frameSignature),largeMotion=motion>23;const stable=captureRevision===trackingRevision?updateTracks(items):tracks;lastFrame=frameSignature;alignOverlay();paint(stable);$('recognized').textContent='OCR全文：\n'+(result.data.text||'（認識なし）')+'\n\nかな：\n'+(items.map(x=>x.text+' → '+romaji(x.text)).join('\n')||'（検出なし）');$('status').textContent='認識：'+items.length+'箇所 / '+((performance.now()-started)/1000).toFixed(1)+'秒';}catch(e){$('status').textContent='認識エラー：'+e.message}finally{busy=false;if(active&&myId===runId)setTimeout(scan,200)}}

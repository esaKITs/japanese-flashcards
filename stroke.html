<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hiragana Stroke Order</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff}
main{width:min(92vw,520px);text-align:center;padding:20px}
h1{font-size:1.1rem;margin:0 0 12px;font-weight:600}
svg{width:min(82vw,420px);height:auto;border:1px solid #ddd;border-radius:10px}
button{margin-top:14px;border:1px solid #bbb;background:#fff;border-radius:8px;padding:9px 18px;font-size:1rem}
small{display:block;margin-top:14px;color:#666}
.stroke{stroke-dasharray:3333;stroke-dashoffset:3333;animation:draw .7s linear forwards calc(var(--i)*.7s + .35s)}
@keyframes draw{to{stroke-dashoffset:0}}
</style>
</head>
<body>
<main>
<h1 id="title">Hiragana stroke order</h1>
<div id="stage"></div>
<button id="replay" type="button">Replay</button>
<small>Stroke data: StrokeSVG / Klee One</small>
</main>
<script>
const params=new URLSearchParams(location.search);
const ch=params.get("char")||"あ";
const allowed=/^[ぁ-ゖ]$/u.test(ch)?ch:"あ";
document.title=allowed+" - Hiragana Stroke Order";
document.getElementById("title").textContent=allowed+"  stroke order";
async function load(){
 const url="https://zhengkyl.github.io/strokesvg/dist/hiragana/"+encodeURIComponent(allowed)+".svg";
 const res=await fetch(url);
 if(!res.ok) throw new Error("Stroke SVG not found");
 const txt=await res.text();
 const doc=new DOMParser().parseFromString(txt,"image/svg+xml");
 const svg=doc.documentElement;
 svg.querySelectorAll('g[data-strokesvg="strokes"] > *').forEach(el=>el.classList.add("stroke"));
 const stage=document.getElementById("stage");
 stage.replaceChildren(document.importNode(svg,true));
}
document.getElementById("replay").onclick=load;
load().catch(e=>document.getElementById("stage").textContent=e.message);
</script>
</body>
</html>

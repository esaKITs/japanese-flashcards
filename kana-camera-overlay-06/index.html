<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>06 — Kana Camera Overlay | esaKITs</title><style>body{font:16px system-ui,-apple-system,sans-serif;margin:0;background:#101820;color:#fff}header{padding:14px 16px}h1{font-size:20px;margin:0 0 6px}.note{font-size:13px;color:#d2dae4;margin:0}.stage{position:relative;width:100%;background:#000;overflow:hidden}video{display:block;width:100%;height:auto;object-fit:contain}canvas.overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}section{padding:14px 16px}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:9px;padding:12px 16px;font-size:16px;font-weight:650;background:#64c4f5;color:#06273d}button:disabled{opacity:.45}#status{padding:10px 0;min-height:28px}#recognized{white-space:pre-wrap;overflow-wrap:anywhere;background:#22313c;padding:12px;border-radius:8px;min-height:36px}details{font-size:13px;color:#d3dfeb}a{color:#8ddaff}</style><header><h1>06 — Kana Camera Overlay</h1><p class="note">無料・広告なし・登録不要。かなとルビだけをローマ字に置き換える試作版です。</p></header><div class="stage" id="stage"><video id="video" autoplay muted playsinline></video><canvas class="overlay" id="overlay"></canvas></div><section><div class="actions"><button id="start">カメラを開始</button><button id="stop" disabled>停止</button><button id="scan" disabled>今の映像を認識</button></div><div id="status" role="status">カメラを開始してください。</div><details><summary>認識したかなを確認</summary><div id="recognized"></div></details><p class="note">04版：映像との位置合わせ、短い半透明ラベル、誤結合の抑制を試験中です。カメラはリアルタイム表示ですが、文字認識は約3秒間隔で更新します。背景が複雑な場合や小さなルビは、正確に置換できない場合があります。映像は外部に送信せず、端末内でOCRを行います。OCR用データは初回にダウンロードします。</p></section><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>
const $=id=>document.getElementById(id),video=$('video'),overlay=$('overlay'),ctx=overlay.getContext('2d'),stage=$('stage');let stream=null,worker=null,active=false,busy=false,runId=0;const work=document.createElement('canvas');const wc=work.getContext('2d',{willReadFrequently:true});const map={あ:'a',い:'i',う:'u',え:'e',お:'o',か:'ka',き:'ki',く:'ku',け:'ke',こ:'ko',さ:'sa',し:'shi',す:'su',せ:'se',そ:'so',た:'ta',ち:'chi',つ:'tsu',て:'te',と:'to',な:'na',に:'ni',ぬ:'nu',ね:'ne',の:'no',は:'ha',ひ:'hi',ふ:'fu',へ:'he',ほ:'ho',ま:'ma',み:'mi',む:'mu',め:'me',も:'mo',や:'ya',ゆ:'yu',よ:'yo',ら:'ra',り:'ri',る:'ru',れ:'re',ろ:'ro',わ:'wa',を:'o',ん:'n',が:'ga',ぎ:'gi',ぐ:'gu',げ:'ge',ご:'go',ざ:'za',じ:'ji',ず:'zu',ぜ:'ze',ぞ:'zo',だ:'da',ぢ:'ji',づ:'zu',で:'de',ど:'do',ば:'ba',び:'bi',ぶ:'be',べ:'be',ぼ:'bo',ぱ:'pa',ぴ:'pi',ぷ:'pu',ぺ:'pe',ぽ:'po'};map['ぶ']='bu';const pairs={きゃ:'kya',きゅ:'kyu',きょ:'kyo',しゃ:'sha',しゅ:'shu',しょ:'sho',ちゃ:'cha',ちゅ:'chu',ちょ:'cho',にゃ:'nya',にゅ:'nyu',にょ:'nyo',ひゃ:'hya',ひゅ:'hyu',ひょ:'hyo',みゃ:'mya',みゅ:'myu',みょ:'myo',りゃ:'rya',りゅ:'ryu',りょ:'ryo',ぎゃ:'gya',ぎゅ:'gyu',ぎょ:'gyo',じゃ:'ja',じゅ:'ju',じょ:'jo',びゃ:'bya',びゅ:'byu',びょ:'byo',ぴゃ:'pya',ぴゅ:'pyu',ぴょ:'pyo'};
function romaji(t){t=t.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));let out='';for(let i=0;i<t.length;i++){let c=t[i],pair=t.slice(i,i+2);if(c==='っ'){let n=pairs[t.slice(i+1,i+3)]||map[t[i+1]]||'';out+=n.startsWith('ch')?'t':n[0]||'';continue}if(c==='ー'){let m=out.match(/[aeiou]$/);if(m)out+=m[0];continue}if(pairs[pair]){out+=pairs[pair];i++;continue}out+=map[c]??c}return out.replace(/ou/g,'ō').replace(/oo/g,'ō').replace(/aa/g,'ā').replace(/uu/g,'ū').replace(/ee/g,'ē').replace(/ii/g,'ī')}
const kanaOnly=/^[ぁ-ゖァ-ヺー・\\s]+$/;
let previousItems=[];
const samples=['こちらをご確認ください','ご利用ありがとうございます','お子様が含まれています','管理してください','忘れないようにしてください','気をつけてください','日本語を勉強しています','よろしくおねがいします','お待ちしております','これから始めます','ご協力をお願いします','こちらで確認できます','もう一度お試しください','ここには何がありますか','ご覧いただきありがとうございます'];const ngrams=new Map();for(const sentence of samples){for(let n=2;n<=3;n++)for(let i=0;i<=sentence.length-n;i++){const k=sentence.slice(i,i+n);ngrams.set(k,(ngrams.get(k)||0)+1)}}function languageScore(t){let score=0;for(let n=2;n<=3;n++)for(let i=0;i<=t.length-n;i++)score+=Math.log1p(ngrams.get(t.slice(i,i+n))||0);return score}
function allLines(data){return (data.blocks||[]).flatMap(b=>(b.paragraphs||[]).flatMap(p=>p.lines||[])).filter(l=>l.bbox&&l.words?.length)}
function lineAngle(l){const w=l.words.filter(w=>w.bbox);if(w.length<2)return null;const f=w[0].bbox,z=w[w.length-1].bbox,dx=(z.x0+z.x1-f.x0-f.x1)/2,dy=(z.y0+z.y1-f.y0-f.y1)/2;return Math.abs(dx)>20?Math.atan2(dy,dx):null}
function commonAngle(data){const candidates=allLines(data).map(l=>({a:lineAngle(l),weight:Math.max(1,l.bbox.x1-l.bbox.x0)})).filter(x=>x.a!==null&&Math.abs(x.a)<.48).sort((a,b)=>a.a-b.a);if(candidates.length<2)return null;let best=null;for(const x of candidates){const cluster=candidates.filter(y=>Math.abs(y.a-x.a)<.10);if(cluster.length<2)continue;const weight=cluster.reduce((v,y)=>v+y.weight,0);if(!best||weight>best.weight)best={angle:cluster.reduce((v,y)=>v+y.a*y.weight,0)/weight,weight,count:cluster.length}}return best?.angle??null}
function extract(data){const lines=allLines(data).filter(l=>(l.words||[]).length>=2);const out=[];for(const line of lines){let run=null;const ws=line.words.filter(w=>w.bbox&&w.text).sort((a,b)=>a.bbox.x0-b.bbox.x0);for(const w of ws){const t=w.text.trim(),b=w.bbox;if(!t)continue;if(!kanaOnly.test(t)||!/[ぁ-ゖァ-ヺ]/.test(t)){if(run)out.push(run);run=null;continue}if(run){const h=Math.min(run.box.y1-run.box.y0,b.y1-b.y0),gap=b.x0-run.box.x1,dy=Math.abs((b.y0+b.y1-run.box.y0-run.box.y1)/2);if(gap>=-h*.1&&gap<h*.38&&dy<h*.45){run.text+=t;run.box.x1=Math.max(run.box.x1,b.x1);run.box.y0=Math.min(run.box.y0,b.y0);run.box.y1=Math.max(run.box.y1,b.y1);continue}out.push(run)}run={text:t,box:{...b}}}if(run)out.push(run)}return out.filter(p=>p.box.x0>=0&&p.box.y0>=0&&p.box.x1<=work.width&&p.box.y1<=work.height)}
function backgroundAt(x,y,w,h){const pts=[[x-3,y+h/2],[x+w+3,y+h/2],[x+w/2,y-3],[x+w/2,y+h+3]];const colors=[];for(const [px,py] of pts){if(px<0||py<0||px>=work.width||py>=work.height)continue;const d=wc.getImageData(Math.round(px),Math.round(py),1,1).data;colors.push([d[0],d[1],d[2]])}if(!colors.length)return [240,240,240];return [0,1,2].map(i=>Math.round(colors.reduce((s,c)=>s+c[i],0)/colors.length))}
function paint(items,angle){overlay.width=work.width;overlay.height=work.height;ctx.clearRect(0,0,overlay.width,overlay.height);ctx.textBaseline='middle';const c=Math.cos(angle),sn=Math.sin(angle),cx=work.width/2,cy=work.height/2;for(const item of items){const b=item.box,x=b.x0,y=b.y0,w=b.x1-x,h=b.y1-y;if(w<5||h<5)continue;const out=romaji(item.text);const px=x+w/2-cx,py=y+h/2-cy;ctx.save();ctx.translate(cx+px*c-py*sn,cy+px*sn+py*c);ctx.rotate(angle);let size=Math.min(46,h*.92);ctx.font='700 '+size+'px system-ui';while(ctx.measureText(out).width>w-6&&size>Math.max(9,h*.38)){size-=.5;ctx.font='700 '+size+'px system-ui'}const tw=ctx.measureText(out).width;if(tw>w-4){ctx.restore();continue}ctx.fillStyle='rgba(225,225,225,.83)';ctx.fillRect(-tw/2-3,-h/2,tw+6,h);ctx.fillStyle='#171717';ctx.fillText(out,-tw/2,0);ctx.restore()}}
function alignOverlay(){if(!video.videoWidth)return;const r=video.getBoundingClientRect(),scale=Math.min(r.width/video.videoWidth,r.height/video.videoHeight),w=video.videoWidth*scale,h=video.videoHeight*scale;overlay.style.left=(r.width-w)/2+'px';overlay.style.top=(r.height-h)/2+'px';overlay.style.width=w+'px';overlay.style.height=h+'px'}
function stabilize(items){const result=items.map(item=>{let best=null,dist=Infinity;for(const old of previousItems){if(old.text!==item.text)continue;const a=old.box,b=item.box;const d=Math.abs(a.x0-b.x0)+Math.abs(a.y0-b.y0);if(d<dist&&d<Math.max(25,(b.y1-b.y0)*1.4)){best=old;dist=d}}if(!best)return item;const b=item.box,a=best.box;return {text:item.text,angle:item.angle,box:{x0:.7*b.x0+.3*a.x0,y0:.7*b.y0+.3*a.y0,x1:.7*b.x1+.3*a.x1,y1:.7*b.y1+.3*a.y1}}});previousItems=result;return result}
const rotated=document.createElement('canvas'),rc=rotated.getContext('2d');let previousAngle=0;
async function scan(){if(!active||busy||!video.videoWidth)return;busy=true;const myId=runId;try{$('status').textContent=worker?'行の角度を確認中…':'日本語OCRを準備中…';if(!worker){if(!window.Tesseract)throw Error('OCRライブラリが読み込まれていません');worker=await Tesseract.createWorker('jpn',1);await worker.setParameters({tessedit_pageseg_mode:'3'})}if(!active||myId!==runId)return;const scale=Math.min(1,960/Math.max(video.videoWidth,video.videoHeight));work.width=Math.round(video.videoWidth*scale);work.height=Math.round(video.videoHeight*scale);wc.drawImage(video,0,0,work.width,work.height);const first=await worker.recognize(work,{}, {text:true,blocks:true});if(!active||myId!==runId)return;const detected=commonAngle(first.data);const angle=detected===null?previousAngle:detected;previousAngle=angle;rotated.width=work.width;rotated.height=work.height;rc.fillStyle='#fff';rc.fillRect(0,0,rotated.width,rotated.height);rc.save();rc.translate(rotated.width/2,rotated.height/2);rc.rotate(-angle);rc.drawImage(work,-work.width/2,-work.height/2);rc.restore();const result=Math.abs(angle)>.012?await worker.recognize(rotated,{}, {text:true,blocks:true}):first;if(!active||myId!==runId)return;const items=extract(result.data);alignOverlay();paint(items,angle);$('recognized').textContent=items.map(x=>x.text+' → '+romaji(x.text)+' [N-gram '+languageScore(x.text).toFixed(1)+']').join('\n')||'複数行のかな領域を検出できませんでした';$('status').textContent='共通傾斜角 '+(angle*180/Math.PI).toFixed(1)+'° / '+items.length+'箇所（約3秒後に再認識）'}catch(e){$('status').textContent='認識エラー：'+e.message}finally{busy=false;if(active&&myId===runId)setTimeout(scan,3000)}}
$('start').onclick=async()=>{if(active)return;try{if(!navigator.mediaDevices?.getUserMedia)throw Error('SafariでHTTPS接続が必要です');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});video.srcObject=stream;await video.play();alignOverlay();active=true;runId++;$('start').disabled=true;$('stop').disabled=false;$('scan').disabled=false;scan()}catch(e){$('status').textContent='カメラを開始できません：'+e.message}};
$('stop').onclick=()=>{active=false;runId++;previousItems=[];previousAngle=0;stream?.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;ctx.clearRect(0,0,overlay.width,overlay.height);$('start').disabled=false;$('stop').disabled=true;$('scan').disabled=true;$('status').textContent='停止しました'};$('scan').onclick=()=>{if(!busy)scan()};
</script></html>
